{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="card"><h1>Create account</h1>
<form method="post">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <label>Name</label><input name="name" required>
  <label>Email</label><input type="email" name="email" required>
  <label>Phone</label><input name="phone">
  <label>Password (6+ chars)</label><input type="password" name="password" required minlength="6">
  <label>I am a</label>
  <select name="role"><option value="citizen">Citizen</option><option value="volunteer">Volunteer</option></select>
  <label>Skills (volunteers)</label><input name="skills" placeholder="First aid, driving, cooking">
  <label>Area (volunteers)</label><input name="location">
  <p><button>Register</button></p>
</form></div>
{% endblock %}
