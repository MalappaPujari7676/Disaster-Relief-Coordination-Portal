{% extends "base.html" %}
{% block title %}Add resource{% endblock %}
{% block content %}
<div class="card"><h1>Add resource</h1>
<form method="post">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <label>Name</label><input name="name" required>
  <label>Category</label><select name="category">{% for c in categories %}<option>{{ c }}</option>{% endfor %}</select>
  <label>Quantity</label><input type="number" name="quantity" min="0" value="0">
  <label>Unit</label><input name="unit" value="units">
  <label>Low-stock threshold</label><input type="number" name="low_threshold" min="0" value="10">
  <label>Location</label><input name="location">
  <label>Incident</label>
  <select name="incident_id"><option value="">— general stock —</option>
    {% for i in incidents %}<option value="{{ i.id }}">{{ i.title }}</option>{% endfor %}</select>
  <p><button>Add</button></p>
</form></div>
{% endblock %}
